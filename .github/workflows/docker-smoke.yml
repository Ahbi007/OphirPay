name: "🐳 Docker Smoke Test"

on:
  pull_request:
    branches: [main, integration/staging]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'docker-compose.yml'

jobs:
  docker-smoke:
    name: "Docker Build & Smoke Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ophirpay:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start backing services
        run: docker compose -f docker-compose.yml up -d db redis
      - name: Run Prisma Migrations
        # The db container needs the schema pushed so it doesn't fail health check
        # Wait, the app container will fail if the DB has no tables, or maybe Prisma fails?
        # Actually, prisma migrate deploy should be run if we want the DB to be ready.
        # Let's run it from the host against the exposed DB port.
        run: |
          npm ci
          npx wait-on tcp:5432
          DATABASE_URL="postgresql://ophirpay:ophirpay@localhost:5432/ophirpay" npx prisma db push
      - name: Smoke test container
        run: |
          docker run -d --name app-smoke \
            --network host \
            -e DATABASE_URL=postgresql://ophirpay:ophirpay@localhost:5432/ophirpay \
            -e REDIS_URL=redis://localhost:6379 \
            -e NEXT_PUBLIC_CONTRACT_ID=CCQGGUJRRVXMHNEX2RYPODGJE2YRMYY4Y7A3KTJH3QP2LWZLTCOPRPET \
            ophirpay:smoke

          echo "Waiting for app to start..."
          npx -y wait-on -t 60000 http://localhost:3000/api/health
          
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          if [ "$status" = "200" ]; then
            echo "✅ Health check passed!"
            exit 0
          else
            echo "❌ Health check failed with status $status."
            docker logs app-smoke
            exit 1
          fi
