name: Lighthouse CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-prisma
      - run: npm run build
      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
